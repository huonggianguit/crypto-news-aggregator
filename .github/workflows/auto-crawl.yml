# .github/workflows/auto-crawl.yml
# GitHub Actions - Auto Crawl every 30 minutes

name: Auto Crawl Crypto News

on:
  # Run every 30 minutes
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes
    # - cron: '0 */1 * * *'   # Every hour (alternative)
  
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      max_articles:
        description: 'Max articles to crawl'
        required: false
        default: '10'

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Trigger Cron API
        run: |
          echo "Triggering crawl at $(date)"
          
          RESPONSE=$(curl -X POST "${{ secrets.SITE_URL }}/api/cron/crawl?max=${{ github.event.inputs.max_articles || '10' }}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -w "\nHTTP_STATUS:%{http_code}" \
            -s)
          
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS")
          
          echo "Response: $BODY"
          echo "HTTP Status: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Error: API returned status $HTTP_STATUS"
            exit 1
          fi
          
          echo "Crawl completed successfully!"
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "Crawl failed at $(date)"
          # Optionally send notification to Slack/Discord/Telegram
          # curl -X POST $DISCORD_WEBHOOK -d '{"content": "Crawl failed!"}'
